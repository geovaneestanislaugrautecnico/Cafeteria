<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="top">
        <nav class="nav">
            <a class="brand" href="index.html">BREAKING ORDERS</a>
            <div>
                <a href="produtos.html">Produtos</a>
                <a href="carrinho.html">Carrinho</a>
            </div>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">Finalizar pedido</h1>

        <div id="resumo"></div>

        <form id="form" class="form">
            <input id="nome" required placeholder="Nome completo">
            <input id="email" type="email" required placeholder="E-mail">
            <input id="telefone" required placeholder="Telefone">

            <select id="metodo">
                <option value="pix">PIX</option>
                <option value="cartao">Cartão</option>
                <option value="dinheiro">Dinheiro</option>
            </select>

            <textarea id="obs" rows="4" placeholder="Observações"></textarea>

            <button class="btn">Confirmar pedido</button>
        </form>

        <div id="resultado"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
